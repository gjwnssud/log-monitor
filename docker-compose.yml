services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./data/loki:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-1.0}"
          memory: "${LOKI_MEM_LIMIT:-512M}"
        reservations:
          cpus: "${LOKI_CPU_RESERVE:-0.25}"
          memory: "${LOKI_MEM_RESERVE:-256M}"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1.0}"
          memory: "${GRAFANA_MEM_LIMIT:-512M}"
        reservations:
          cpus: "${GRAFANA_CPU_RESERVE:-0.25}"
          memory: "${GRAFANA_MEM_RESERVE:-256M}"
    depends_on:
      - loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      - ./data/logs:/logs
      - ./data/alloy:/data-alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    deploy:
      resources:
        limits:
          cpus: "${ALLOY_CPU_LIMIT:-0.5}"
          memory: "${ALLOY_MEM_LIMIT:-256M}"
        reservations:
          cpus: "${ALLOY_CPU_RESERVE:-0.1}"
          memory: "${ALLOY_MEM_RESERVE:-128M}"
    depends_on:
      - loki
    restart: unless-stopped
