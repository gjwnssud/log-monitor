services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.5}"
          memory: "${PROMETHEUS_MEM_LIMIT:-256M}"
        reservations:
          cpus: "${PROMETHEUS_CPU_RESERVE:-0.1}"
          memory: "${PROMETHEUS_MEM_RESERVE:-128M}"
    restart: unless-stopped

  textfile-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: textfile-exporter
    command:
      - '--web.listen-address=:9091'
      - '--collector.disable-defaults'
      - '--collector.textfile'
      - '--collector.textfile.directory=/textfiles'
    volumes:
      - ./data/metrics:/textfiles:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "64M"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./data/loki:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-1.0}"
          memory: "${LOKI_MEM_LIMIT:-512M}"
        reservations:
          cpus: "${LOKI_CPU_RESERVE:-0.25}"
          memory: "${LOKI_MEM_RESERVE:-256M}"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TZ=Asia/Seoul
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1.0}"
          memory: "${GRAFANA_MEM_LIMIT:-512M}"
        reservations:
          cpus: "${GRAFANA_CPU_RESERVE:-0.25}"
          memory: "${GRAFANA_MEM_RESERVE:-256M}"
    depends_on:
      - loki
    restart: unless-stopped
