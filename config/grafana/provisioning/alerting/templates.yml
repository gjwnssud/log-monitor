apiVersion: 1

templates:
  - orgId: 1
    name: log_monitor
    template: |
      {{ define "log_monitor.telegram" -}}
      {{- if eq .Status "firing" -}}
      {{- if eq (index .CommonLabels "severity") "critical" }}🔴 [긴급]{{ else }}🟠 [경고]{{ end }} {{ index .CommonLabels "alertname" }}
      {{ range .Alerts.Firing }}
      {{ .Annotations.description }}
      ⏰ {{ .StartsAt.Local.Format "01/02 15:04" }}
      {{- end }}
      {{- else -}}
      ✅ [해소] {{ index .CommonLabels "alertname" }}
      {{ range .Alerts.Resolved }}
      {{ .Annotations.description }}
      ⏰ {{ .StartsAt.Local.Format "01/02 15:04" }} ~ {{ .EndsAt.Local.Format "15:04" }}
      {{- end }}
      {{- end }}

      🔗 http://localhost:3000/d/spring-boot-incident
      {{- end }}
