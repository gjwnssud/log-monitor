apiVersion: 1

groups:
  - orgId: 1
    name: 로그 알림
    folder: 알림
    interval: 1m
    rules:

      # FATAL 로그: 5분간 1건 이상 발생 시, 1분간 지속되면 알림
      - uid: fatal-log-alert
        title: "FATAL 로그 발생"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="logs",level="FATAL"}[5m]))'
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                uid: __expr__
                type: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              datasource:
                uid: __expr__
                type: __expr__
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          description: "FATAL {{ $values.B }}건 감지 (최근 5분)"
        labels:
          severity: critical
        isPaused: false

      # ERROR 급증: 5분간 30건 초과 시, 5분간 지속되면 알림
      - uid: error-surge-alert
        title: "ERROR 급증"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="logs",level="ERROR"}[5m]))'
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                uid: __expr__
                type: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              datasource:
                uid: __expr__
                type: __expr__
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: "ERROR {{ $values.B }}건 감지 (최근 5분, 임계값 30건 초과)"
        labels:
          severity: warning
        isPaused: false
